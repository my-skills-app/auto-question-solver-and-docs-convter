[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-chatgpt"
version = "1.0.0"
description = "Local ChatGPT OAuth / API-key client for any Python project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.60.0",
  "httpx>=0.27.0",
  "authlib>=1.3.0",
  "pymupdf>=1.24.0",
  "Pillow>=10.0.0",
  "python-docx>=1.1.0",
]

[project.scripts]
local-chatgpt = "local_chatgpt.__main__:main"

[tool.setuptools.packages.find]
include = ["local_chatgpt*"]